<script>

let trackCount = 3;

let activeAbortController = null;

let searchRunning = false;

let currentJobId = null;

let previewSequence = 0;


/* =======================================================
   CANCEL
======================================================= */

async function cancelSearch() {

  if (!searchRunning) {
    return;
  }

  const jobId =
    currentJobId;

  /*
   * Abort the browser's SSE connection.
   */

  if (activeAbortController) {
    activeAbortController.abort();
    activeAbortController = null;
  }

  /*
   * Tell backend to cancel the job too.
   */

  if (jobId) {
    try {
      await fetch(
        `https://soundcrossfinder.duckdns.org/api/search/${encodeURIComponent(jobId)}/cancel`,
        {
          method: "POST"
        }
      );
    } catch {}
  }

  currentJobId = null;

  searchRunning = false;

  document.getElementById(
    "cancel-btn"
  ).style.display = "none";

  document.getElementById(
    "search-btn"
  ).disabled = false;

  updateQueueDisplay({
    phase: "idle"
  });
}


/* =======================================================
   HTML ESCAPE
======================================================= */

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =======================================================
   TRACK PREVIEW
======================================================= */

async function handleInputChange(
  inputEl
) {

  const wrapper =
    inputEl.closest(
      ".input-wrapper"
    );

  const inputGroup =
    wrapper.querySelector(
      ".input-group"
    );

  const previewEl =
    wrapper.querySelector(
      ".preview-container"
    );

  const url =
    inputEl.value.trim();

  if (
    !url ||
    !url.includes(
      "soundcloud.com"
    )
  ) {
    previewEl.innerHTML = "";

    inputEl.dataset.lastUrl = "";

    inputGroup.style.display =
      "flex";

    return;
  }

  if (
    inputEl.dataset.lastUrl ===
    url
  ) {
    return;
  }

  const requestId =
    ++previewSequence;

  inputEl.dataset.lastUrl =
    url;

  previewEl.innerHTML =
    '<div class="preview-loading">⏳ Loading track info...</div>';

  try {

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        20000
      );

    const response =
      await fetch(
        `https://soundcloud.com/oembed?format=json&url=${encodeURIComponent(url)}`,
        {
          signal:
            controller.signal
        }
      );

    clearTimeout(timeout);

    if (
      requestId !==
      previewSequence
    ) {
      return;
    }

    if (!response.ok) {
      throw new Error(
        "Track not found"
      );
    }

    const data =
      await response.json();

    inputGroup.style.display =
      "none";

    previewEl.innerHTML = `

      <div class="track-card">

        <div class="track-main-info">

          <img
            src="${escapeHtml(
              data.thumbnail_url ||
              "https://soundcloud.com/favicon.ico"
            )}"
            alt="Artwork"
            class="track-thumb"
            onerror="this.style.display='none'"
          >

          <div class="track-details">

            <div class="track-name">
              ${escapeHtml(
                data.title ||
                "Unknown Track"
              )}
            </div>

            <div class="track-artist">
              by ${escapeHtml(
                data.author_name ||
                "SoundCloud Artist"
              )}
            </div>

          </div>

        </div>

        <button
          class="card-remove-btn"
          onclick="handleRemoveSlot(this)"
        >
          ✕
        </button>

      </div>
    `;

  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {
      previewEl.innerHTML =
        '<div class="preview-error">⚠️ Track preview timed out.</div>';
    } else {
      previewEl.innerHTML =
        '<div class="preview-error">⚠️ Could not load track preview.</div>';
    }
  }
}


/* =======================================================
   REMOVE SLOT
======================================================= */

function handleRemoveSlot(
  btnEl
) {

  const wrapper =
    btnEl.closest(
      ".input-wrapper"
    );

  const total =
    document.querySelectorAll(
      "#inputs .input-wrapper"
    ).length;

  if (total > 3) {
    wrapper.remove();
    return;
  }

  const input =
    wrapper.querySelector(
      'input[type="text"]'
    );

  const inputGroup =
    wrapper.querySelector(
      ".input-group"
    );

  const preview =
    wrapper.querySelector(
      ".preview-container"
    );

  input.value = "";

  input.dataset.lastUrl = "";

  preview.innerHTML = "";

  inputGroup.style.display =
    "flex";

  input.focus();
}


function handleRemoveRawInput(
  btnEl
) {

  const total =
    document.querySelectorAll(
      "#inputs .input-wrapper"
    ).length;

  const wrapper =
    btnEl.closest(
      ".input-wrapper"
    );

  if (total > 3) {
    wrapper.remove();
  } else {

    const input =
      wrapper.querySelector(
        'input[type="text"]'
      );

    input.value = "";

    input.dataset.lastUrl = "";
  }
}


/* =======================================================
   ADD INPUT
======================================================= */

function addTrackInput(
  initialValue = ""
) {

  trackCount++;

  const inputsDiv =
    document.getElementById(
      "inputs"
    );

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "input-wrapper";

  wrapper.innerHTML = `

    <div class="input-group">

      <input
        type="text"
        placeholder="Paste SoundCloud track URL ${trackCount}"
        value="${escapeHtml(initialValue)}"
        oninput="handleInputChange(this)"
      >

      <button
        class="remove-btn"
        onclick="handleRemoveRawInput(this)"
      >
        ✕
      </button>

    </div>

    <div class="preview-container"></div>
  `;

  inputsDiv.appendChild(
    wrapper
  );

  return wrapper.querySelector(
    "input"
  );
}


/* =======================================================
   QUEUE DISPLAY
======================================================= */

function updateQueueDisplay(
  data
) {

  const panel =
    document.getElementById(
      "queue-panel"
    );

  const number =
    document.getElementById(
      "queue-number"
    );

  const message =
    document.getElementById(
      "queue-message"
    );

  const subtitle =
    document.getElementById(
      "queue-subtitle"
    );

  const active =
    document.getElementById(
      "queue-active"
    );

  const waiting =
    document.getElementById(
      "queue-waiting"
    );

  const capacity =
    document.getElementById(
      "queue-capacity"
    );

  if (
    !data ||
    data.phase === "idle"
  ) {
    panel.style.display =
      "none";

    return;
  }

  panel.style.display =
    "block";

  active.textContent =
    Number(
      data.active || 0
    );

  waiting.textContent =
    Number(
      data.waiting || 0
    );

  capacity.textContent =
    Number(
      data.capacity || 0
    );

  if (
    data.phase ===
    "waiting"
  ) {

    const position =
      Number(
        data.position || 1
      );

    number.textContent =
      position;

    message.textContent =
      "⏳ Waiting for a scan slot...";

    if (
      position === 1
    ) {

      subtitle.textContent =
        "You are next. Your scan will start automatically when a slot opens.";

    } else {

      subtitle.textContent =
        `There ${
          position - 1 === 1
            ? "is"
            : "are"
        } ${
          position - 1
        } scan${
          position - 1 === 1
            ? ""
            : "s"
        } ahead of you.`;
    }

    return;
  }

  if (
    data.phase ===
    "active"
  ) {

    number.textContent =
      "✓";

    message.textContent =
      "🚀 Your scan is running!";

    subtitle.textContent =
      `${data.active || 0} of ${
        data.capacity || 0
      } scan slots are currently in use.`;

    return;
  }

  if (
    data.phase ===
    "checking"
  ) {

    number.textContent =
      "…";

    message.textContent =
      data.message ||
      "Checking scan queue...";

    subtitle.textContent =
      `${data.active || 0} of ${
        data.capacity || 0
      } scan slots are currently active.`;
  }
}


/* =======================================================
   LOG
======================================================= */

function appendLog(
  message
) {

  const log =
    document.getElementById(
      "log"
    );

  log.textContent +=
    message + "\n";

  log.scrollTop =
    log.scrollHeight;
}


/* =======================================================
   START SEARCH
======================================================= */

async function startSearch() {

  if (searchRunning) {
    return;
  }

  const inputs =
    document.querySelectorAll(
      "#inputs input[type='text']"
    );

  const trackUrls =
    Array.from(inputs)
      .map(
        input =>
          input.value.trim()
      )
      .filter(Boolean);

  if (
    trackUrls.length === 0
  ) {
    alert(
      "Please enter at least one track URL."
    );

    return;
  }

  if (
    trackUrls.length > 20
  ) {
    alert(
      "Maximum 20 tracks are allowed."
    );

    return;
  }

  if (
    activeAbortController
  ) {
    activeAbortController.abort();
  }

  activeAbortController =
    new AbortController();

  searchRunning = true;

  currentJobId = null;

  const urlParams =
    new URLSearchParams();

  trackUrls.forEach(
    (url, index) => {
      urlParams.set(
        `t${index + 1}`,
        url
      );
    }
  );

  window.history.pushState(
    null,
    "",
    window.location.pathname +
      "?" +
      urlParams.toString()
  );

  document.getElementById(
    "status-card"
  ).style.display =
    "block";

  document.getElementById(
    "results-card"
  ).style.display =
    "none";

  document.getElementById(
    "cancel-btn"
  ).style.display =
    "inline-block";

  document.getElementById(
    "search-btn"
  ).disabled =
    true;

  const log =
    document.getElementById(
      "log"
    );

  log.textContent =
    "Connecting to server...\n";

  updateQueueDisplay({
    phase: "checking",

    active: 0,

    waiting: 0,

    capacity: 0,

    position: null,

    message:
      "Joining scan queue..."
  });

  setTimeout(() => {
    document.getElementById(
      "status-card"
    ).scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }, 100);

  const resultsData = {
    common: [],
    partial: [],
    trackCount: 0
  };

  try {

    const response =
      await fetch(
        "https://soundcrossfinder.duckdns.org/api/search",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Accept":
              "text/event-stream"
          },

          body:
            JSON.stringify({
              trackUrls
            }),

          signal:
            activeAbortController.signal
        }
      );

    if (!response.ok) {

      const text =
        await response.text();

      appendLog(
        `❌ HTTP Error: ${response.status} ${text}`
      );

      return;
    }

    if (!response.body) {
      throw new Error(
        "Server did not provide a streaming response."
      );
    }

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";

    while (true) {

      const {
        value,
        done
      } =
        await reader.read();

      if (done) {
        break;
      }

      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );

      const events =
        buffer.split(
          "\n\n"
        );

      buffer =
        events.pop() || "";

      for (
        const eventBlock of events
      ) {

        processSSEBlock(
          eventBlock,
          resultsData
        );
      }
    }

    /*
     * Process final buffered event.
     */

    if (
      buffer.trim()
    ) {

      processSSEBlock(
        buffer,
        resultsData
      );
    }

  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {

      appendLog(
        "⏹️ Search canceled."
      );

    } else {

      appendLog(
        `❌ Network Error: ${error.message}`
      );
    }

  } finally {

    searchRunning = false;

    activeAbortController =
      null;

    currentJobId = null;

    document.getElementById(
      "cancel-btn"
    ).style.display =
      "none";

    document.getElementById(
      "search-btn"
    ).disabled =
      false;
  }
}


/* =======================================================
   SSE PARSER
======================================================= */

function processSSEBlock(
  eventBlock,
  resultsData
) {

  const lines =
    eventBlock
      .trim()
      .split(/\r?\n/);

  for (
    const line of lines
  ) {

    if (
      line.startsWith(":")
    ) {
      continue;
    }

    if (
      !line.startsWith(
        "data:"
      )
    ) {
      continue;
    }

    const jsonStr =
      line
        .replace(
          /^data:\s*/,
          ""
        )
        .trim();

    if (!jsonStr) {
      continue;
    }

    try {

      const data =
        JSON.parse(
          jsonStr
        );

      handleServerEvent(
        data,
        resultsData
      );

    } catch (error) {

      console.error(
        "SSE parse error:",
        error,
        jsonStr
      );
    }
  }
}


/* =======================================================
   SERVER EVENTS
======================================================= */

function handleServerEvent(
  data,
  resultsData
) {

  /*
   * JOB ID
   */

  if (
    data.status ===
    "job"
  ) {

    currentJobId =
      data.jobId;

    return;
  }


  /*
   * QUEUE
   */

  if (
    data.status ===
    "queue"
  ) {

    updateQueueDisplay(
      data
    );

    /*
     * If the server says active,
     * make sure the user sees it immediately.
     */

    return;
  }


  /*
   * PROGRESS
   */

  if (
    data.status ===
    "progress"
  ) {

    appendLog(
      data.message || ""
    );

    return;
  }


  /*
   * META
   */

  if (
    data.status ===
    "results-meta"
  ) {

    resultsData.common = [];

    resultsData.partial = [];

    resultsData.trackCount =
      data.resolvedTracksCount ||
      0;

    if (
      data.diagnostics
    ) {

      appendLog(
        `📊 API diagnostics: ` +
        `${data.diagnostics.totalRequests || 0} requests, ` +
        `${data.diagnostics.rateLimited || 0} rate limits, ` +
        `${data.diagnostics.timeouts || 0} timeouts.`
      );
    }

    return;
  }


  /*
   * COMMON
   */

  if (
    data.status ===
    "results-common"
  ) {

    if (
      Array.isArray(
        data.items
      )
    ) {

      resultsData.common.push(
        ...data.items
      );
    }

    return;
  }


  /*
   * PARTIAL
   */

  if (
    data.status ===
    "results-partial"
  ) {

    if (
      Array.isArray(
        data.items
      )
    ) {

      resultsData.partial.push(
        ...data.items
      );
    }

    return;
  }


  /*
   * COMPLETE
   */

  if (
    data.status ===
    "complete"
  ) {

    appendLog(
      "✅ DONE! Rendering final results..."
    );

    updateQueueDisplay({
      phase: "idle"
    });

    setTimeout(() => {

      renderResults(
        resultsData
      );

    }, 100);

    return;
  }


  /*
   * ERROR
   */

  if (
    data.status ===
    "error"
  ) {

    appendLog(
      `❌ Error: ${
        data.message ||
        "Unknown error"
      }`
    );

    updateQueueDisplay({
      phase: "idle"
    });

    return;
  }
}


/* =======================================================
   RENDER RESULTS
======================================================= */

function renderResults(
  data
) {

  document.getElementById(
    "status-card"
  ).style.display =
    "none";

  document.getElementById(
    "results-card"
  ).style.display =
    "block";

  const container =
    document.getElementById(
      "results-content"
    );

  const getLikes =
    playlist =>
      Number(
        playlist.likes_count ??
        playlist.favoritings_count ??
        playlist.likes ??
        playlist.likesCount ??
        playlist.like_count ??
        playlist.favorites_count ??
        0
      );

  data.common.sort(
    (a, b) =>
      getLikes(b) -
      getLikes(a)
  );

  data.partial.sort(
    (a, b) => {

      if (
        (b.count || 0) !==
        (a.count || 0)
      ) {
        return (
          (b.count || 0) -
          (a.count || 0)
        );
      }

      return (
        getLikes(b) -
        getLikes(a)
      );
    }
  );

  let html = `

    <h4 style="color:#10b981;">
      🏆 Complete Matches
      (${data.common.length}
      playlists contain ALL
      ${data.trackCount}
      tracks):
    </h4>
  `;

  if (
    data.common.length > 0
  ) {

    html += `

      <table>

        <tr>
          <th>Title</th>
          <th>Curator</th>
          <th>Likes</th>
          <th>Link</th>
        </tr>
    `;

    data.common.forEach(
      playlist => {

        const title =
          escapeHtml(
            playlist.title
          );

        const user =
          escapeHtml(
            playlist.user ||
            "Unknown"
          );

        const url =
          escapeHtml(
            playlist.url ||
            ""
          );

        const likes =
          getLikes(
            playlist
          ).toLocaleString();

        html += `

          <tr>

            <td title="${title}">
              ${title}
            </td>

            <td>
              ${user}
            </td>

            <td class="likes-col">
              ❤️ ${likes}
            </td>

            <td>
              ${
                url
                  ? `<a
                      href="${url}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Open ↗
                    </a>`
                  : "—"
              }
            </td>

          </tr>
        `;
      }
    );

    html += `
      </table>
    `;

  } else {

    html += `

      <p style="color:#94a3b8;">
        No playlists contain all
        selected tracks together.
      </p>
    `;
  }


  html += `

    <h4
      style="
        margin-top:25px;
        color:#facc15;
      "
    >
      ⚡ Partial Matches
      (${data.partial.length}
      playlists feature some tracks):
    </h4>
  `;

  if (
    data.partial.length > 0
  ) {

    html += `

      <table>

        <tr>

          <th>Title</th>

          <th>Matches</th>

          <th>Likes</th>

          <th>Curator</th>

          <th>Link</th>

        </tr>
    `;

    data.partial.forEach(
      playlist => {

        const title =
          escapeHtml(
            playlist.title
          );

        const user =
          escapeHtml(
            playlist.user ||
            "Unknown"
          );

        const url =
          escapeHtml(
            playlist.url ||
            ""
          );

        const likes =
          getLikes(
            playlist
          ).toLocaleString();

        html += `

          <tr>

            <td title="${title}">
              ${title}
            </td>

            <td>
              <b>
                ${Number(
                  playlist.count || 0
                )}
              </b>
              /
              ${data.trackCount}
            </td>

            <td class="likes-col">
              ❤️ ${likes}
            </td>

            <td>
              ${user}
            </td>

            <td>
              ${
                url
                  ? `<a
                      href="${url}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Open ↗
                    </a>`
                  : "—"
              }
            </td>

          </tr>
        `;
      }
    );

    html += `
      </table>
    `;

  } else {

    html += `

      <p style="color:#94a3b8;">
        No partial overlaps found.
      </p>
    `;
  }

  container.innerHTML =
    html;

  setTimeout(() => {

    document.getElementById(
      "results-card"
    ).scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 100);
}


/* =======================================================
   SHAREABLE URL
======================================================= */

window.addEventListener(
  "DOMContentLoaded",
  async () => {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const trackUrls = [];

    let i = 1;

    while (
      params.has(`t${i}`)
    ) {

      const value =
        (
          params.get(`t${i}`) ||
          ""
        ).trim();

      if (value) {
        trackUrls.push(
          value
        );
      }

      i++;
    }

    if (
      trackUrls.length === 0
    ) {
      return;
    }

    const inputsDiv =
      document.getElementById(
        "inputs"
      );

    inputsDiv.innerHTML =
      "";

    trackCount = 0;

    const slots =
      Math.max(
        3,
        trackUrls.length
      );

    for (
      let idx = 0;
      idx < slots;
      idx++
    ) {

      const value =
        trackUrls[idx] ||
        "";

      const input =
        addTrackInput(
          value
        );

      if (value) {
        handleInputChange(
          input
        );
      }
    }

    setTimeout(
      () => startSearch(),
      500
    );
  }
);

</script>
